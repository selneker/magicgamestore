<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Événements - Magic Game Store</title>
    <link rel="icon" type="image/png" href="/images/image.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <style>
        /* ========== STYLE POUR LA PAGE ÉVÉNEMENTS ========== */
        .events-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .texte-container {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .texte-container span {
            color: rgba(255, 255, 255, 0.175);
            font-size: 1.2rem;
            display: block;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .texte-container h1 {
            color: rgba(255, 255, 255, 0.175);
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0;
            line-height: 1.2;
        }

        /* Animation subtile */
        .texte-container {
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== STYLE BOTTOM NAVIGATION ========== */
        .bottom-nav-link {
            cursor: pointer;
        }

        .bottom-nav-link.active {
            color: var(--accent-color) !important;
        }

        .bottom-nav-link.active span {
            color: var(--accent-color);
        }

        .bottom-nav-link.active i {
            color: var(--accent-color);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .texte-container h1 {
                font-size: 1.8rem;
            }
            
            .texte-container span {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- CONTENU PRINCIPAL -->
    <div class="events-page">
        <div class="texte-container">
            <span>Merci de visiter notre site web</span>
            <h1>Aucun événement disponible pour le moment</h1>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <main class="bottom-nav">
        <nav>
            <ul>     
                <li>
                    <a href="index.html" id="bottomAchatLink" class="bottom-nav-link">
                        <i data-lucide="shopping-cart"></i> 
                        <span>Achat UC</span>
                    </a>
                </li>
                <li>
                    <a href="index.html" id="bottomAbonnementLink" class="bottom-nav-link">
                        <i data-lucide="crown"></i> 
                        <span>Abonnement</span>
                    </a>
                </li>
                <li>
                    <a href="evenements.html" class="bottom-nav-link active">
                        <i data-lucide="rss"></i> 
                        <span>Event</span>
                    </a>
                </li> 
                <li>
                    <a href="historique.html" class="bottom-nav-link">
                        <i data-lucide="history"></i> 
                        <span>Historique</span>
                    </a>
                </li> 
                
            </ul>
        </nav>
    </main>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    
    <!-- SCRIPT POUR LA NAVIGATION (optionnel, si besoin de switch) -->
    <script>
        // ========== ÉLÉMENTS NÉCESSAIRES ==========
        const bottomAchatLink = document.getElementById('bottomAchatLink');
        const bottomAbonnementLink = document.getElementById('bottomAbonnementLink');
        
        // ========== GESTION DU SWITCH (si tu veux changer l'active) ==========
        // Par défaut, c'est "Event" qui est actif sur cette page
        
        // Si tu veux que les liens Achat et Abonnement pointent vers index.html avec le bon mode
        if (bottomAchatLink) {
            bottomAchatLink.addEventListener('click', (e) => {
                e.preventDefault();
                // Sauvegarde le mode dans localStorage
                localStorage.setItem('mode', 'uc');
                // Redirige vers index.html
                window.location.href = 'index.html';
            });
        }
        
        if (bottomAbonnementLink) {
            bottomAbonnementLink.addEventListener('click', (e) => {
                e.preventDefault();
                // Sauvegarde le mode dans localStorage
                localStorage.setItem('mode', 'abonnements');
                // Redirige vers index.html
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
