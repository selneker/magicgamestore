<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Événements - Magic Game Store</title>
    <link rel="icon" type="image/png" href="/images/image.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="evenements.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
</head>
<body>
    <!-- CONTENU PRINCIPAL -->
    <div class="events-page">
        <div class="events-container">
            <!-- Header avec badge -->
            <div class="events-header">
                <span>Magic Game Store <i data-lucide="badge-check" width="15px" heigth="15px"style="color: var(--accent-color);"></i></span>
            </div>
            
            <!-- Image en background -->
            <div class="image-content"></div>
            
            <!-- Texte description -->
            <div class="abouttxt">
                <div class="abouttxt-container">
                    <h3>Pre-Order RP A18</h3>
                    <span>Promotion Royal Pass A18</span>
                    <div class="redirect">
                        <h3>60UC
                            <br>
                            <span style="text-decoration: line-through !important;">720UC</span>
                        </h3>
                        <button class="acheter" data-pack="60 UC" data-price="5,000 Ar">Pre-Order</button>
                    </div>
                </div>
            </div>

            <!-- Actions: Like et Share -->
            <div class="event-actions">
                <div class="action-buttons">
                    <!-- Like button avec compteur -->
                    <button class="action-btn like-btn" id="likeBtn" onclick="handleLike()">
                        <i class="fa-regular fa-heart" id="likeIcon"></i>
                        <span id="likeCount">0</span>
                    </button>
                    
                    <!-- Share button avec compteur -->
                    <button class="action-btn share-btn" onclick="handleShare()">
                        <i class="fa-regular fa-share-from-square"></i>
                        <span id="shareCount">0</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <main class="bottom-nav">
        <nav>
            <ul>     
                <li>
                    <a href="index.html" id="bottomAchatLink" class="bottom-nav-link">
                        <i data-lucide="shopping-cart"></i> 
                        <span>Achat UC</span>
                    </a>
                </li>
                <li>
                    <a href="index.html" id="bottomAbonnementLink" class="bottom-nav-link">
                        <i data-lucide="crown"></i> 
                        <span>Abonnement</span>
                    </a>
                </li>
                <li>
                    <a href="evenements.html" class="bottom-nav-link active">
                        <i data-lucide="rss"></i> 
                        <span>Event</span>
                    </a>
                </li> 
                <li>
                    <a href="historique.html" class="bottom-nav-link">
                        <i data-lucide="history"></i> 
                        <span>Historique</span>
                    </a>
                </li> 
            </ul>
        </nav>
    </main>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="evenements.js"></script>
</body>
</html>
