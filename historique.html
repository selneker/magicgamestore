<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/image.png">
    <title>Historique - Magic Game Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <style>

        /* =============================================
           HISTORIQUE — Apple-inspired, palette intacte
           ============================================= */

        * { box-sizing: border-box; }

        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: var(--primary-color);
            color: var(--secondly-color);
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        /* ---- PAGE TITLE SECTION ---- */
        .page-title-section {
            padding: 28px 20px 0;
            max-width: 680px;
            margin: 0 auto;
        }

        .page-title-section h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--secondly-color);
            margin: 0 0 4px;
            line-height: 1.1;
        }

        .page-subtitle {
            font-size: 0.82rem;
            color: rgba(236,236,236,0.4);
            margin: 0;
            font-weight: 400;
        }

        /* ---- SEARCH CARD ---- */
        .search-card {
            max-width: 680px;
            margin: 20px auto 0;
            padding: 0 20px;
        }

        .search-inner {
            background: #1c1c1e;
            border-radius: 16px;
            border: 0.5px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .search-input-row {
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
        }

        .search-icon {
            color: rgba(236,236,236,0.25);
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        #searchPubgId {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 0;
            font-size: 0.95rem;
            color: var(--secondly-color);
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            outline: none;
        }

        #searchPubgId::placeholder {
            color: rgba(236,236,236,0.22);
        }

        #searchPubgId.valid   { color: var(--secondly-color); }
        #searchPubgId.invalid { color: var(--secondly-color); }

        .search-divider {
            height: 0.5px;
            background: rgba(255,255,255,0.07);
            margin: 0 16px;
        }

        .search-hint-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            gap: 10px;
        }

        #validationMessage {
            font-size: 0.72rem;
            color: var(--error-color);
            display: none;
            flex: 1;
        }

        .search-hint {
            font-size: 0.72rem;
            color: rgba(236,236,236,0.25);
            flex: 1;
        }

        .btn-search {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 99px;
            padding: 7px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            cursor: pointer;
            transition: opacity 0.14s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-search:hover { opacity: 0.82; }
        .btn-search:active { opacity: 0.65; transform: scale(0.97); }

        /* ---- TOOLBAR (filtres + refresh) ---- */
        .toolbar {
            max-width: 680px;
            margin: 16px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        #filtersSection {
            display: none;
            flex: 1;
        }

        #filtersSection.visible { display: flex; }

        .filter-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 14px;
            border-radius: 99px;
            border: 0.5px solid rgba(255,255,255,0.1);
            background: transparent;
            color: rgba(236,236,236,0.5);
            font-size: 0.78rem;
            font-weight: 500;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .filter-btn:hover:not(.active) {
            background: rgba(255,255,255,0.06);
            color: var(--secondly-color);
        }

        .btn-refresh {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 0.88rem;
            font-weight: 400;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.14s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-refresh:hover { opacity: 0.65; }
        .btn-refresh i { font-size: 0.8rem; margin-right: 4px; }

        /* ---- ORDERS CONTAINER ---- */
        .orders-wrap {
            max-width: 680px;
            margin: 16px auto 0;
            padding: 0 20px;
        }

        /* ---- ÉTAT VIDE ---- */
        .empty-state {
            background: #1c1c1e;
            border-radius: 16px;
            border: 0.5px solid rgba(255,255,255,0.07);
            padding: 48px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .empty-state-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(0,122,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .empty-state-icon i {
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .empty-state h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--secondly-color);
            margin: 0;
            letter-spacing: -0.01em;
        }

        .empty-state p {
            font-size: 0.78rem;
            color: rgba(236,236,236,0.35);
            margin: 0;
            max-width: 240px;
            line-height: 1.5;
        }

        /* ---- LOADING ---- */
        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 48px 0;
            color: rgba(236,236,236,0.35);
            font-size: 0.85rem;
        }

        .loading-state i {
            color: var(--accent-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- ERROR STATE ---- */
        .error-state {
            background: rgba(244,67,54,0.06);
            border-radius: 16px;
            border: 0.5px solid rgba(244,67,54,0.2);
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .error-state-icon {
            width: 36px;
            height: 36px;
            border-radius: 99px;
            background: rgba(244,67,54,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .error-state-icon i { color: var(--error-color); font-size: 0.85rem; }

        .error-state-text h3 {
            font-size: 0.88rem;
            font-weight: 600;
            margin: 0 0 2px;
            color: var(--secondly-color);
        }

        .error-state-text p {
            font-size: 0.75rem;
            color: rgba(236,236,236,0.4);
            margin: 0;
        }

        /* ---- ORDERS GRID ---- */
        .orders-grid {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 0.5px solid rgba(255,255,255,0.07);
        }

        /* ---- ORDER CARD ---- */
        .order-card {
            background: #1c1c1e;
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            transition: background 0.14s;
            position: relative;
        }

        .order-card:first-child { border-radius: 16px 16px 0 0; }
        .order-card:last-child  { border-radius: 0 0 16px 16px; }
        .order-card:only-child  { border-radius: 16px; }
        .order-card:hover { background: #242426; }

        /* Stripe colorée gauche selon statut */
        .order-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 14px;
            bottom: 14px;
            width: 3px;
            border-radius: 0 3px 3px 0;
        }

        .order-card.status-en-attente::before { background: #ff9f0a; }
        .order-card.status-livré::before      { background: #34c759; }
        .order-card.status-annulé::before     { background: #ff3b30; }

        .order-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 10px;
        }

        .order-pack-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--secondly-color);
            letter-spacing: -0.01em;
            margin: 0;
        }

        .order-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .order-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: rgba(236,236,236,0.4);
        }

        .order-meta-item i {
            font-size: 0.65rem;
            color: rgba(236,236,236,0.25);
            width: 10px;
        }

        /* Badge paiement */
        .payment-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            border-radius: 99px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .payment-badge.mvola {
            background: rgba(0,166,81,0.12);
            color: #34c759;
        }

        .payment-badge.orange {
            background: rgba(255,121,0,0.12);
            color: #ff9f0a;
        }

        /* Côté droit */
        .order-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .status-badge.status-en-attente {
            background: rgba(255,159,10,0.12);
            color: #ff9f0a;
        }

        .status-badge.status-livré {
            background: rgba(52,199,89,0.12);
            color: #34c759;
        }

        .status-badge.status-annulé {
            background: rgba(255,59,48,0.12);
            color: #ff3b30;
        }

        .order-id {
            font-size: 0.68rem;
            color: rgba(236,236,236,0.22);
            font-variant-numeric: tabular-nums;
        }

        /* ---- RÉSUMÉ COUNT ---- */
        .orders-count {
            font-size: 0.7rem;
            color: rgba(236,236,236,0.3);
            text-align: right;
            padding: 10px 0 4px;
            letter-spacing: 0.02em;
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 480px) {
            .page-title-section h1 { font-size: 1.5rem; }
            .order-meta { gap: 6px; }
        }

    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="header-logo">
                <h1><a href="index.html">Magic Game Store</a></h1>
            </div>
            <nav>
                <li><a href="historique.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> Historique</a></li>
                <li><a href="index.html"><i class="fa-solid fa-cart-plus"></i> Boutique</a></li>
            </nav>
        </div>
    </header>

    <!-- TITRE PAGE -->
    <div class="page-title-section">
        <h1>Historique</h1>
        <p class="page-subtitle">Vos commandes Magic Game Store</p>
    </div>

    <!-- RECHERCHE -->
    <div class="search-card">
        <div class="search-inner">
            <div class="search-input-row">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input
                    type="text"
                    id="searchPubgId"
                    placeholder="ID PUBG Mobile (9–13 chiffres)"
                    oninput="validateInput()"
                    onkeypress="return event.charCode >= 48 && event.charCode <= 57"
                    onkeydown="if(event.key==='Enter') searchOrders()"
                />
            </div>
            <div class="search-divider"></div>
            <div class="search-hint-row">
                <span id="validationMessage"></span>
                <span class="search-hint" id="searchHintText">Entrez votre ID pour voir vos achats</span>
                <button class="btn-search" onclick="searchOrders()">Rechercher</button>
            </div>
        </div>
    </div>

    <!-- TOOLBAR : filtres + refresh -->
    <div class="toolbar">
        <div id="filtersSection">
            <div class="filter-pills">
                <button class="filter-btn active" onclick="filterOrders('all', this)">Tous</button>
                <button class="filter-btn" onclick="filterOrders('en attente', this)">En attente</button>
                <button class="filter-btn" onclick="filterOrders('livré', this)">Livrés</button>
                <button class="filter-btn" onclick="filterOrders('annulé', this)">Annulés</button>
            </div>
        </div>
        <button class="btn-refresh" onclick="refreshHistory()" id="refreshBtn" style="display:none;">
            <i class="fa-solid fa-rotate-right"></i> Actualiser
        </button>
    </div>

    <!-- COMMANDES -->
    <div class="orders-wrap" id="ordersContainer">
        <div class="empty-state">
            <div class="empty-state-icon">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h3>Aucune commande</h3>
            <p>Entrez votre ID PUBG pour afficher vos achats</p>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <main class="bottom-nav">
        <nav>
            <ul>
                <li>
                    <a href="index.html" class="bottom-nav-link">
                        <i data-lucide="shopping-cart"></i>
                        <span>Achat</span>
                    </a>
                </li>
                <li>
                    <a href="index.html" class="bottom-nav-link">
                        <i data-lucide="crown"></i>
                        <span>Abonnement</span>
                    </a>
                </li>
                <li>
                    <a href="evenements.html">
                        <i data-lucide="rss"></i>
                        <span>Event</span>
                    </a>
                </li>
                <li>
                    <a href="historique.html" class="bottom-nav-link active">
                        <i data-lucide="history"></i>
                        <span>Commande</span>
                    </a>
                </li>
            </ul>
        </nav>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script> lucide.createIcons(); </script>

    <script>
        const API_URL = (() => {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:3000/api';
            }
            return `${window.location.origin}/api`;
        })();

        let currentOrders = [];
        let currentFilter = 'all';
        let currentPubgId = '';

        // ---- VALIDATION ----
        function validatePubgId(pubgId) {
            if (!pubgId) return { valid: false, message: 'Entrez votre ID PUBG' };
            if (!/^\d+$/.test(pubgId)) return { valid: false, message: 'Chiffres uniquement' };
            if (pubgId.length < 9) return { valid: false, message: 'Minimum 9 chiffres' };
            if (pubgId.length > 13) return { valid: false, message: 'Maximum 13 chiffres' };
            return { valid: true };
        }

        function validateInput() {
            const input = document.getElementById('searchPubgId');
            const msgEl = document.getElementById('validationMessage');
            const hintEl = document.getElementById('searchHintText');
            const pubgId = input.value.trim();
            const v = validatePubgId(pubgId);

            if (pubgId === '') {
                input.classList.remove('invalid', 'valid');
                msgEl.style.display = 'none';
                hintEl.style.display = 'block';
            } else if (!v.valid) {
                input.classList.add('invalid');
                input.classList.remove('valid');
                msgEl.textContent = v.message;
                msgEl.style.display = 'block';
                hintEl.style.display = 'none';
            } else {
                input.classList.add('valid');
                input.classList.remove('invalid');
                msgEl.style.display = 'none';
                hintEl.style.display = 'block';
            }
        }

        // ---- SEARCH ----
        async function searchOrders() {
            const pubgId = document.getElementById('searchPubgId').value.trim();
            const v = validatePubgId(pubgId);
            if (!v.valid) {
                const msgEl = document.getElementById('validationMessage');
                msgEl.textContent = v.message;
                msgEl.style.display = 'block';
                document.getElementById('searchHintText').style.display = 'none';
                return;
            }

            currentPubgId = pubgId;
            setLoading();

            try {
                const response = await fetch(`${API_URL}/orders/user/${pubgId}`);
                const orders = await response.json();
                currentOrders = Array.isArray(orders) ? orders : [];

                const filtersEl = document.getElementById('filtersSection');
                const refreshBtn = document.getElementById('refreshBtn');

                if (currentOrders.length > 0) {
                    filtersEl.classList.add('visible');
                    refreshBtn.style.display = 'block';
                    // reset filtres
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    document.querySelector('.filter-btn').classList.add('active');
                    currentFilter = 'all';
                } else {
                    filtersEl.classList.remove('visible');
                    refreshBtn.style.display = 'none';
                }

                displayOrders(currentOrders);

            } catch (e) {
                setError();
                document.getElementById('filtersSection').classList.remove('visible');
                document.getElementById('refreshBtn').style.display = 'none';
            }
        }

        // ---- DISPLAY STATES ----
        function setLoading() {
            document.getElementById('ordersContainer').innerHTML = `
                <div class="loading-state">
                    <i class="fa-solid fa-spinner"></i>
                    Chargement…
                </div>
            `;
        }

        function setError() {
            document.getElementById('ordersContainer').innerHTML = `
                <div class="error-state">
                    <div class="error-state-icon">
                        <i class="fa-solid fa-exclamation"></i>
                    </div>
                    <div class="error-state-text">
                        <h3>Erreur de chargement</h3>
                        <p>Impossible de récupérer votre historique. Réessayez.</p>
                    </div>
                </div>
            `;
        }

        // ---- DISPLAY ORDERS ----
        function displayOrders(orders) {
            const container = document.getElementById('ordersContainer');

            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h3>Aucune commande trouvée</h3>
                        <p>Aucune commande pour l'ID ${currentPubgId}</p>
                    </div>
                `;
                return;
            }

            const cards = orders.map(order => {
                const statusClass = order.status === 'en attente' ? 'status-en-attente'
                                  : order.status === 'livré'     ? 'status-livré'
                                  : 'status-annulé';

                const statusLabel = order.status === 'en attente' ? 'En attente'
                                  : order.status === 'livré'      ? 'Livré'
                                  : 'Annulé';

                let paymentBadge = '';
                if (order.paymentMethod === 'MVola') {
                    paymentBadge = `<span class="payment-badge mvola">MVola</span>`;
                } else if (order.paymentMethod === 'Orange Money') {
                    paymentBadge = `<span class="payment-badge orange">Orange Money</span>`;
                }

                const date = new Date(order.date);
                const dateStr = date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
                const timeStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                return `
                    <div class="order-card ${statusClass}">
                        <div class="order-left">
                            <p class="order-pack-title">${order.pack}</p>
                            <div class="order-meta">
                                <span class="order-meta-item">
                                    <i class="fa-regular fa-calendar"></i> ${dateStr}
                                </span>
                                <span class="order-meta-item">
                                    <i class="fa-regular fa-clock"></i> ${timeStr}
                                </span>
                                <span class="order-meta-item">
                                    <i class="fa-solid fa-tag"></i> ${order.price}
                                </span>
                                <span class="order-meta-item">
                                    <i class="fa-regular fa-user"></i> ${order.pseudo}
                                </span>
                                ${paymentBadge}
                            </div>
                        </div>
                        <div class="order-right">
                            <span class="status-badge ${statusClass}">${statusLabel}</span>
                            <span class="order-id">#${order.id}</span>
                        </div>
                    </div>
                `;
            }).join('');

            const total = orders.length;
            container.innerHTML = `
                <p class="orders-count">${total} commande${total > 1 ? 's' : ''}</p>
                <div class="orders-grid">${cards}</div>
            `;
        }

        // ---- FILTER ----
        function filterOrders(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const filtered = filter === 'all' ? currentOrders : currentOrders.filter(o => o.status === filter);
            displayOrders(filtered);
        }

        // ---- REFRESH ----
        async function refreshHistory() {
            if (currentPubgId) {
                const icon = document.querySelector('#refreshBtn i');
                if (icon) icon.style.animation = 'spin 0.8s linear infinite';
                await searchOrders();
                if (icon) icon.style.animation = '';
            }
        }

        // ---- AUTO REFRESH 30s ----
        setInterval(() => {
            if (currentPubgId) searchOrders();
        }, 30000);
    </script>
</body>


<svg style="display: none;">
  <filter id="liquid-glass">
    <!-- Génère une texture de "bruit" fluide -->
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" result="noise" />
    <!-- Adoucit le bruit pour un aspect plus liquide -->
    <feGaussianBlur in="noise" stdDeviation="20" result="softNoise" />
    <!-- Déplace les pixels de l'arrière-plan en fonction du bruit -->
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="255" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>


</html>
