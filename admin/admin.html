<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin — Magic Game Store</title>
    <link rel="icon" type="image/png" href="/images/image.png">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginSection" class="login-container">
    <div class="login-box">
        <div class="login-logo">
            <h1>Admin <span>Space</span></h1>
            <p>Magic Game Store</p>
        </div>
        <div class="login-inputs">
            <div class="login-field">
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
            </div>
            <div class="login-field">
                <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password"
                    onkeydown="if(event.key==='Enter') login()">
            </div>
        </div>
        <button class="login-btn" onclick="login()">Se connecter</button>
        <p id="loginError" class="login-error"></p>
    </div>
</div>

<!-- ══ ADMIN ══ -->
<div id="adminSection" style="display:none;">

    <!-- HEADER -->
    <header class="admin-header">
        <div class="header-container">

            <div class="header-logo">
                <a href="admin.html">MGS <span>Admin</span></a>
            </div>

            <!-- Toggle statut en ligne -->
            <div class="status-toggle-wrap">
                <span class="status-toggle-label" id="adminStatusText">En ligne</span>
                <label class="ios-toggle">
                    <input type="checkbox" id="statusToggleInput" checked onchange="toggleAdminStatus()">
                    <span class="ios-toggle-track"></span>
                    <span class="ios-toggle-thumb"></span>
                </label>
            </div>

            <!-- Actions desktop -->
            <div class="header-actions-desktop">
                <span id="adminEmail"></span>
                <button onclick="backupData()" class="hdr-btn" title="Backup">
                    <i class="fas fa-download"></i> Backup
                </button>
                <button onclick="exportData()" class="hdr-btn" title="Export">
                    <i class="fas fa-file-export"></i> Export
                </button>
                <button onclick="restoreData()" class="hdr-btn" title="Restore">
                    <i class="fas fa-upload"></i> Restore
                </button>
                <button onclick="showLogsPanel()" class="hdr-btn" title="Logs">
                    <i class="fas fa-history"></i> Logs
                </button>
                <button onclick="logout()" class="hdr-btn hdr-btn-danger" title="Déconnexion">
                    <i class="fas fa-sign-out-alt"></i> Quitter
                </button>
            </div>

            <!-- Burger mobile -->
            <button class="hdr-menu-btn" onclick="openSheet()" aria-label="Menu">
                <i class="fas fa-bars"></i>
            </button>

        </div>
    </header>

    <!-- STATS desktop -->
    <div class="stats-container">
        <div class="stat-card">
            <p>Total commandes</p>
            <h3 id="totalOrders">0</h3>
        </div>
        <div class="stat-card">
            <p>Chiffre d'affaires</p>
            <h3 id="totalRevenue">0 <span>Ar</span></h3>
        </div>
        <div class="stat-card">
            <p>En attente</p>
            <h3 id="pendingOrders">0</h3>
        </div>
        <div class="stat-card">
            <p>Livrées</p>
            <h3 id="deliveredOrders">0</h3>
        </div>
    </div>

    <!-- FILTRES -->
    <div class="filters">
        <div class="filter-search">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Rechercher par ID PUBG ou pseudo…">
        </div>
        <select id="methodFilter">
            <option value="all">Tous paiements</option>
            <option value="MVola">MVola</option>
            <option value="Orange Money">Orange Money</option>
        </select>
        <select id="statusFilter">
            <option value="all">Tous statuts</option>
            <option value="en attente">En attente</option>
            <option value="livré">Livré</option>
            <option value="annulé">Annulé</option>
        </select>
        <button onclick="refreshOrders()" class="refresh-btn">
            <i class="fas fa-sync-alt"></i> Actualiser
        </button>
    </div>

    <!-- TABLEAU + CARDS -->
    <div class="table-container">
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>ID PUBG</th>
                    <th>Pseudo</th>
                    <th>Pack</th>
                    <th>Prix</th>
                    <th>Paiement</th>
                    <th>Référence</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ordersBody">
                <tr><td colspan="10" class="loading">
                    <i class="fas fa-spinner fa-spin" style="margin-right:8px;color:var(--accent)"></i>Chargement…
                </td></tr>
            </tbody>
        </table>
        <div class="orders-cards" id="ordersMobileCards"></div>
    </div>

</div>

<!-- ══ BOTTOM SHEET (mobile/tablette) ══ -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>

    <!-- Stats -->
    <div class="sheet-stats">
        <div class="sheet-stat">
            <span class="sheet-stat-label">Total</span>
            <span class="sheet-stat-value" id="sheetTotalOrders">0</span>
        </div>
        <div class="sheet-stat">
            <span class="sheet-stat-label">CA</span>
            <span class="sheet-stat-value" id="sheetTotalRevenue">0 <span>Ar</span></span>
        </div>
        <div class="sheet-stat">
            <span class="sheet-stat-label">En attente</span>
            <span class="sheet-stat-value" id="sheetPendingOrders">0</span>
        </div>
        <div class="sheet-stat">
            <span class="sheet-stat-label">Livrées</span>
            <span class="sheet-stat-value" id="sheetDeliveredOrders">0</span>
        </div>
    </div>

    <!-- Actions -->
    <div class="sheet-section-title">Actions</div>
    <div class="sheet-actions-group">
        <button class="sheet-action-row" onclick="backupData();closeSheet()">
            <div class="sheet-action-left">
                <div class="sheet-action-icon icon-green"><i class="fas fa-download"></i></div>
                <span>Backup</span>
            </div>
            <i class="fas fa-chevron-right sheet-action-chevron"></i>
        </button>
        <button class="sheet-action-row" onclick="exportData();closeSheet()">
            <div class="sheet-action-left">
                <div class="sheet-action-icon icon-green"><i class="fas fa-file-export"></i></div>
                <span>Export CSV</span>
            </div>
            <i class="fas fa-chevron-right sheet-action-chevron"></i>
        </button>
        <button class="sheet-action-row" onclick="restoreData();closeSheet()">
            <div class="sheet-action-left">
                <div class="sheet-action-icon icon-green"><i class="fas fa-upload"></i></div>
                <span>Restaurer</span>
            </div>
            <i class="fas fa-chevron-right sheet-action-chevron"></i>
        </button>
        <button class="sheet-action-row" onclick="showLogsPanel();closeSheet()">
            <div class="sheet-action-left">
                <div class="sheet-action-icon icon-green"><i class="fas fa-history"></i></div>
                <span>Historique logs</span>
            </div>
            <i class="fas fa-chevron-right sheet-action-chevron"></i>
        </button>
    </div>

    <!-- Déconnexion -->
    <div class="sheet-actions-group" style="margin-bottom:8px;">
        <button class="sheet-action-row" onclick="logout()" style="color:var(--red)">
            <div class="sheet-action-left">
                <div class="sheet-action-icon icon-red"><i class="fas fa-sign-out-alt"></i></div>
                <span>Déconnexion</span>
            </div>
            <i class="fas fa-chevron-right sheet-action-chevron"></i>
        </button>
    </div>

    <div class="sheet-email" id="sheetEmail"></div>
</div>

<script src="admin.js"></script>
<script>
// ══ BOTTOM SHEET ══
function openSheet() {
    const overlay = document.getElementById('sheetOverlay');
    const sheet   = document.getElementById('bottomSheet');
    overlay.style.display = 'block';
    requestAnimationFrame(() => {
        overlay.classList.add('open');
        sheet.classList.add('open');
    });
    document.body.style.overflow = 'hidden';
    // Sync stats dans la sheet
    syncSheetStats();
}

function closeSheet() {
    const overlay = document.getElementById('sheetOverlay');
    const sheet   = document.getElementById('bottomSheet');
    overlay.classList.remove('open');
    sheet.classList.remove('open');
    setTimeout(() => {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
    }, 320);
}

function syncSheetStats() {
    const map = {
        sheetTotalOrders:    'totalOrders',
        sheetPendingOrders:  'pendingOrders',
        sheetDeliveredOrders:'deliveredOrders',
    };
    for (const [sheetId, mainId] of Object.entries(map)) {
        const el = document.getElementById(sheetId);
        const src = document.getElementById(mainId);
        if (el && src) el.textContent = src.textContent;
    }
    // Revenue
    const rev = document.getElementById('totalRevenue');
    const sheetRev = document.getElementById('sheetTotalRevenue');
    if (rev && sheetRev) sheetRev.innerHTML = rev.innerHTML;

    // Email
    const email = document.getElementById('adminEmail');
    const sheetEmail = document.getElementById('sheetEmail');
    if (email && sheetEmail) sheetEmail.textContent = email.textContent;
}

// ══ TOGGLE STATUT ══
// Override pour syncer le label
const _origToggle = window.toggleAdminStatus;
window.toggleAdminStatus = function() {
    const checkbox = document.getElementById('statusToggleInput');
    const label    = document.getElementById('adminStatusText');
    // La valeur du checkbox est déjà changée par l'event onchange
    if (checkbox.checked) {
        label.textContent = 'En ligne';
    } else {
        label.textContent = 'Hors ligne';
    }
    // Appeler la fonction originale si elle existe
    if (typeof _origToggle === 'function') _origToggle();
    else {
        // fallback inline
        const adminOnlineVal = checkbox.checked;
        localStorage.setItem('adminStatus', adminOnlineVal ? 'online' : 'offline');
    }
};
</script>
</body>
</html>
